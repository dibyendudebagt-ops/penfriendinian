<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background-color: #0d0d1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #gameHeader {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 400px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px #000;
        }
        #scoreBoard { color: #ff3366; }
        #livesBoard { color: #00f2fe; }
        canvas {
            box-shadow: 0px 0px 40px rgba(0, 242, 254, 0.4);
            border: 4px solid #333;
            background-color: #05050a;
        }
    </style>
</head>
<body>

<div id="gameHeader">
    <div id="scoreBoard">SCORE ₹ : <span id="score">0</span></div>
    <div id="livesBoard">LIVES 💓: <span id="lives"></span></div>
</div>
<canvas id="jardinainsCanvas"></canvas>


<script>
    const canvas = document.getElementById("jardinainsCanvas");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("score");
    const livesDisplay = document.getElementById("lives");

    canvas.height = window.innerHeight * 0.82;
    canvas.width = canvas.height * (9 / 16); 

    let score = 0;
    let lives = 3;
    let gameOver = false;

    // Load Background Character
    const bgImg = new Image();
    bgImg.src = "character.png"; 

    // Dynamic Multi-Ball System (Starts with 1, can grow to 3)
    let balls = [
        { x: canvas.width / 2, y: canvas.height * 0.75, radius: 7, dx: 3.5, dy: -5 }
    ];

    const paddle = { x: canvas.width / 2 - 50, y: canvas.height * 0.90, width: 100, height: 14 };

    // Dense Brick Setup
    const brickRows = 9;
    const brickCols = 8;
    const brickPadding = 2;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 10;
    const brickWidth = (canvas.width - (brickOffsetLeft * 2)) / brickCols - brickPadding;
    const brickHeight = 18;

    const bricks = [];
    for (let c = 0; c < brickCols; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRows; r++) {
            let type = "normal";
            let durability = 1;
            let color = `hsl(${(r * 30) + 200}, 85%, 55%)`;

            if (r === 0 || r === 1) {
                type = "gold"; durability = 3; color = "#ffd700"; 
            } else if (r === 2) {
                type = "silver"; durability = 2; color = "#b0c4de";
            }

            // Hide random gifts/scores in some bricks (30% chance)
            let giftType = null;
            if (Math.random() < 0.3) {
                giftType = Math.random() < 0.5 ? "score_boost" : "extra_ball";
            }

            bricks[c][r] = { 
                x: 0, y: 0, 
                status: durability, maxStatus: durability,
                type: type, color: color, gift: giftType
            };
        }
    }

    // Floating text popups and falling items
    let fallingObjects = [];
    let scorePopups = [];

    // Paddle Controls
    function movePaddle(e) {
        if (gameOver) return;
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let rect = canvas.getBoundingClientRect();
        let relativeX = clientX - rect.left;
        if (relativeX > 0 && relativeX < canvas.width) {
            paddle.x = relativeX - paddle.width / 2;
        }
    }
    window.addEventListener("mousemove", movePaddle);
    window.addEventListener("touchmove", movePaddle, { passive: false });

    function collisionDetection() {
        for (let c = 0; c < brickCols; c++) {
            for (let r = 0; r < brickRows; r++) {
                let b = bricks[c][r];
                if (b.status > 0) {
                    balls.forEach(ball => {
                        if (ball.x > b.x && ball.x < b.x + brickWidth && ball.y > b.y && ball.y < b.y + brickHeight) {
                            ball.dy = -ball.dy;
                            b.status -= 1;
                            
                            if (b.status === 0) {
                                score += b.type === "gold" ? 100 : b.type === "silver" ? 50 : 20;
                                
                                // Reveal Gift or Score from inside the broken brick!
                                if (b.gift) {
                                    fallingObjects.push({
                                        x: b.x + brickWidth / 2, y: b.y + brickHeight,
                                        speedY: 3, type: b.gift, label: b.gift === "score_boost" ? " +500" : " BALL+"
                                    });
                                }
                            } else {
                                score += 10;
                            }
                            scoreDisplay.innerText = score;
                        }
                    });
                }
            }
        }
    }

    function drawBalls() {
        balls.forEach(ball => {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.closePath();
        });
    }

    function drawPaddle() {
        ctx.fillStyle = "#00f2fe";
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        ctx.strokeStyle = "#fff";
        ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBricks() {
        for (let c = 0; c < brickCols; c++) {
            for (let r = 0; r < brickRows; r++) {
                let b = bricks[c][r];
                if (b.status > 0) {
                    let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                    let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                    b.x = brickX; b.y = brickY;

                    ctx.fillStyle = b.color;
                    ctx.fillRect(brickX, brickY, brickWidth, brickHeight);

                    if (b.status < b.maxStatus) {
                        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                        ctx.fillRect(brickX, brickY, brickWidth, brickHeight * 0.3);
                    }
                    ctx.strokeStyle = "rgba(0,0,0,0.2)";
                    ctx.strokeRect(brickX, brickY, brickWidth, brickHeight);
                }
            }
        }
    }

    function drawFallingObjects() {
        fallingObjects.forEach((obj, index) => {
            obj.y += obj.speedY;

            // Draw a spinning/floating reward capsule box
            ctx.fillStyle = obj.type === "score_boost" ? "#ff007f" : "#00ffcc";
            ctx.fillRect(obj.x - 15, obj.y - 10, 30, 20);
            
            ctx.fillStyle = "#fff";
            ctx.font = "10px sans-serif";
            ctx.fillText(obj.type === "score_boost" ? "500" : "BALL", obj.x - 12, obj.y + 4);

            // Catching mechanism
            if (obj.y + 10 >= paddle.y && obj.x > paddle.x && obj.x < paddle.x + paddle.width) {
                if (obj.type === "score_boost") {
                    score += 500;
                    scorePopups.push({ x: obj.x, y: paddle.y - 20, text: "+500 BONUS!", alpha: 1 });
                } else if (obj.type === "extra_ball" && balls.length < 3) {
                    // Spawn another dynamic interactive ball up to a maximum limit of 3
                    balls.push({ x: paddle.x + paddle.width/2, y: paddle.y - 15, radius: 7, dx: (Math.random() - 0.5) * 6, dy: -5 });
                    scorePopups.push({ x: obj.x, y: paddle.y - 20, text: "MULTI-BALL!", alpha: 1 });
                }
                scoreDisplay.innerText = score;
                fallingObjects.splice(index, 1);
            }
            if (obj.y > canvas.height) fallingObjects.splice(index, 1);
        });
    }

    function drawPopups() {
        scorePopups.forEach((pop, index) => {
            pop.y -= 1;
            pop.alpha -= 0.02;
            ctx.fillStyle = `rgba(255, 255, 255, ${pop.alpha})`;
            ctx.font = "bold 14px Arial";
            ctx.fillText(pop.text, pop.x - 30, pop.y);
            if (pop.alpha <= 0) scorePopups.splice(index, 1);
        });
    }

    function updateBallPhysics() {
        for (let i = balls.length - 1; i >= 0; i--) {
            let ball = balls[i];

            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collisions
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) ball.dx = -ball.dx;
            if (ball.y + ball.dy < ball.radius) ball.dy = -ball.dy;

            // Paddle tracking
            if (ball.y + ball.dy > paddle.y - ball.radius) {
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    let hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    ball.dx = hitPos * 6;
                    ball.dy = -ball.dy;
                } else if (ball.y + ball.dy > canvas.height) {
                    // Remove current ball from the active stack if it drops out
                    balls.splice(i, 1);
                    
                    // If no balls are left on screen, lose a life!
                    if (balls.length === 0) {
                        lives -= 1;
                        livesDisplay.innerText = "".repeat(lives) || "DEAD";
                        
                        if (lives <= 0) {
                            gameOver = true;
                        } else {
                            // Respawn a clean fresh ball to try again
                            balls.push({ x: canvas.width / 2, y: canvas.height * 0.65, radius: 7, dx: 3.5, dy: -5 });
                        }
                    }
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw original background picture frame
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

        // Draw copyright text on canvas
ctx.save();
ctx.fillStyle = "#ffffff"; // Set color to white
ctx.font = "bold 14px 'Courier New'"; // Set font size and style
ctx.textAlign = "center"; // Center the text horizontally
// This places it near the bottom of the canvas, just above the paddle area
ctx.fillText("©DibyenduDeb", canvas.width / 2, canvas.height * 0.85); 
ctx.restore();
    
        // Dark block overlay layer masking uncleared blocks
        ctx.save();
        ctx.fillStyle = "#16162a"; 
        for (let c = 0; c < brickCols; c++) {
            for (let r = 0; r < brickRows; r++) {
                let b = bricks[c][r];
                if (b.status > 0) {
                    ctx.fillRect(b.x - 1, b.y - 1, brickWidth + brickPadding, brickHeight + brickPadding);
                }
            }
        }
        ctx.restore();

        // Render gameplay assets
        drawBricks();
        drawBalls();
        drawPaddle();
        drawFallingObjects();
        drawPopups();
        
        if (!gameOver) {
            collisionDetection();
            updateBallPhysics();
            requestAnimationFrame(draw);
        } else {
            // Screen Overlay for Game Over state
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#ff3366";
            ctx.font = "bold 32px 'Courier New'";
            ctx.fillText("GAME OVER", canvas.width / 2 - 85, canvas.height / 2 - 20);
            
            ctx.fillStyle = "#fff";
            ctx.font = "18px 'Courier New'";
            ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2 - 80, canvas.height / 2 + 20);
        }
    }

    bgImg.onload = function() {
        draw();
    };
</script>
</body>
</html>
